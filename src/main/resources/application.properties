spring.application.name=best-practice
# Load local settings from .env when it exists (local dev). Real environment variables still take priority.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${BEST_PRACTICE_MAIN_DB}
spring.datasource.username=${BEST_PRACTICE_MAIN_DB_USERNAME}
spring.datasource.password=${BEST_PRACTICE_MAIN_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
